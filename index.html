<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#008f72">
  <meta name="description" content="NASHO Health Center mobile application">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/nasho-logo.png">
  <link rel="apple-touch-icon" href="/nasho-logo.png">
  <link rel="stylesheet" href="/styles.css">
  <title>NASHO Health Center</title>
</head>
<body>
  <div id="splash" class="splash">
    <img src="/nasho-logo.png" alt="NASHO Health Center">
    <h1>NASHO</h1>
    <h2>Health Center</h2>
    <p>Healthy People • Strong Community</p>
    <div class="loader"><span></span></div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="brand">
        <img src="/nasho-logo.png" alt="">
        <div><strong>NASHO</strong><small>Health Center</small></div>
      </div>
      <button class="icon-btn" id="notifyBtn" aria-label="Notifications">🔔</button>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-page="services" class="nav-item"><span>♡</span><small>Services</small></button>
      <button data-page="appointment" class="nav-item"><span>▣</span><small>Appointment</small></button>
      <button data-page="discussion" class="nav-item"><span>◌</span><small>Discussion</small></button>
      <button data-page="account" class="nav-item"><span>♙</span><small>Account</small></button>
    </nav>
  </div>

  <div id="drawer" class="drawer-backdrop hidden">
    <aside class="drawer">
      <button id="closeDrawer" class="close">×</button>
      <img src="/nasho-logo.png" class="drawer-logo" alt="NASHO">
      <h2>NASHO Health Center</h2>
      <p>Healthy People • Strong Community</p>
      <div class="drawer-links">
        <button data-page="home">⌂ Home</button>
        <button data-page="services">♡ Services</button>
        <button data-page="appointment">▣ Appointment</button>
        <button data-page="discussion">◌ Discussion</button>
        <button data-page="contact">☎ Contact</button>
        <button data-page="account">♙ My Account</button>
      </div>
      <a class="emergency-side" href="tel:+250790261899">🚨 Emergency: +250 790 261 899</a>
    </aside>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
