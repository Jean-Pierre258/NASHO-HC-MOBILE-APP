<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#087f78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NASHO">
<title>NASHO Health Center</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./nasho-logo.png">
<link rel="apple-touch-icon" href="./nasho-logo.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#f5fbfa;color:#123;overflow:hidden}

#splash{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#064f50,#087f78 55%,#43b96b);
}
.splashBox{text-align:center;color:#fff;padding:24px}
.splashLogo{
  width:120px;height:120px;object-fit:cover;border-radius:28px;
  display:block;margin:0 auto 20px;
  background:#fff;box-shadow:0 14px 35px rgba(0,0,0,.22)
}
.splashTitle{font-size:27px;font-weight:800}
.splashSub{margin-top:7px;font-size:14px;opacity:.92}
.progress{width:210px;height:5px;background:rgba(255,255,255,.28);border-radius:20px;margin:28px auto 0;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#fff;animation:load3s 3s linear forwards}
@keyframes load3s{to{width:100%}}

#app{height:100%;display:flex;flex-direction:column}
.header{
  height:76px;background:#fff;border-bottom:1px solid #e5eeee;
  display:flex;align-items:center;padding:0 18px;gap:12px
}
.headerLogo{
  width:46px;height:46px;border-radius:13px;object-fit:cover;
  background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.10)
}
.headerTitle{font-size:17px;font-weight:800;color:#087f78}
.headerSub{font-size:12px;color:#718080;margin-top:2px}

main{flex:1;padding:30px 20px}
.myApps{font-size:25px;font-weight:800;color:#123;margin-bottom:20px}

.appCard{
  width:100%;min-height:150px;background:#fff;border:1px solid #e5eeee;
  border-radius:24px;padding:28px;display:flex;align-items:center;
  box-shadow:0 10px 28px rgba(8,127,120,.08)
}
.appIconButton{
  width:78px;height:78px;border:0;border-radius:21px;padding:0;
  background:#fff;overflow:hidden;cursor:pointer;
  box-shadow:0 8px 20px rgba(8,127,120,.18)
}
.appIconButton img{
  width:100%;height:100%;display:block;object-fit:cover
}
.appIconButton:active{transform:scale(.94)}

#opening{
  position:fixed;inset:0;z-index:30;display:none;
  align-items:center;justify-content:center;background:#f5fbfa
}
#opening.show{display:flex}
.openingLogo{width:92px;height:92px;border-radius:24px;object-fit:cover}
</style>
</head>

<body>

<section id="splash">
  <div class="splashBox">
    <img class="splashLogo" src="./nasho-logo.png"
         alt="NASHO Health Center"
         onerror="this.style.display='none'">
    <div class="splashTitle">Welcome to NASHO Health Center</div>
    <div class="splashSub">Healthy People • Strong Community</div>
    <div class="progress"><i></i></div>
  </div>
</section>

<div id="app">
  <header class="header">
    <img class="headerLogo" src="./nasho-logo.png"
         alt="NASHO" onerror="this.style.display='none'">
    <div>
      <div class="headerTitle">NASHO Health Center</div>
      <div class="headerSub">Mobile App</div>
    </div>
  </header>

  <main>
    <div class="myApps">MY APPS</div>

    <section class="appCard">
      <button id="nashoIcon" class="appIconButton"
              type="button" aria-label="Open NASHO Health Center">
        <img src="./nasho-logo.png"
             alt="NASHO Health Center"
             onerror="this.style.display='none'">
      </button>
    </section>
  </main>
</div>

<div id="opening">
  <img class="openingLogo" src="./nasho-logo.png" alt="NASHO Health Center">
</div>

<script>
const NASHO_WEBSITE = "https://nasho-hc-services.vercel.app/";
const splash = document.getElementById("splash");
const icon = document.getElementById("nashoIcon");
const opening = document.getElementById("opening");

/* EXACTLY 3 seconds */
setTimeout(function(){
  splash.style.display = "none";
}, 3000);

icon.addEventListener("click", function(){
  opening.classList.add("show");
  setTimeout(function(){
    window.location.href = NASHO_WEBSITE;
  }, 250);
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(function(err){
    console.log("SW:", err);
  });
}
</script>

</body>
</html>
