<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#087f78">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-title"
  content="NASHO"
>

<title>NASHO Health Center</title>

<link rel="manifest" href="./manifest.json">

<link
  rel="icon"
  href="./nasho-logo.png"
  type="image/png"
>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
}

body{
  background:#f5fbfa;
  color:#123;
  overflow-x:hidden;
}


/* =====================================================
   SPLASH SCREEN
===================================================== */

#splash{
  position:fixed;
  inset:0;
  z-index:100;

  background:
    linear-gradient(
      145deg,
      #064f50,
      #087f78,
      #43b96b
    );

  display:flex;
  align-items:center;
  justify-content:center;
}

.sbox{
  text-align:center;
  color:white;
  padding:20px;
}

.slogo{
  width:120px;
  height:120px;

  border-radius:28px;

  object-fit:cover;

  display:block;

  margin:0 auto 20px;

  background:white;
}

.stitle{
  font-size:26px;
  font-weight:800;
}

.ssub{
  margin-top:8px;
  font-size:14px;
}

.bar{
  width:210px;
  height:5px;

  background:#ffffff55;

  border-radius:10px;

  margin:28px auto 0;

  overflow:hidden;
}

.bar i{
  display:block;
  width:0;
  height:100%;

  background:white;

  animation:load 3s linear forwards;
}

@keyframes load{
  to{
    width:100%;
  }
}


/* =====================================================
   HEADER
===================================================== */

.header{
  height:76px;

  background:white;

  border-bottom:1px solid #e5eeee;

  display:flex;
  align-items:center;

  padding:0 18px;

  gap:12px;
}

.hlogo{
  width:46px;
  height:46px;

  border-radius:13px;

  object-fit:cover;
}

.htitle{
  font-size:17px;
  font-weight:800;
  color:#087f78;
}

.hsub{
  font-size:12px;
  color:#718080;
  margin-top:2px;
}


/* =====================================================
   MAIN
===================================================== */

main{
  padding:30px 20px 50px;
  max-width:1200px;
  margin:auto;
}

.myapps{
  font-size:25px;
  font-weight:800;

  margin-bottom:20px;

  color:#123;
}


/* =====================================================
   APP CONTAINER
===================================================== */

.card{
  background:white;

  border:1px solid #e5eeee;

  border-radius:24px;

  padding:28px;

  box-shadow:
    0 10px 28px #087f7814;
}


/* =====================================================
   APPS GRID
===================================================== */

.apps-grid{

  display:grid;

  grid-template-columns:
    repeat(3, minmax(140px, 1fr));

  gap:24px;

  align-items:start;

}


/* =====================================================
   APP ITEM
===================================================== */

.app-item{
  display:flex;

  flex-direction:column;

  align-items:center;

  text-decoration:none;

  color:inherit;

  min-width:0;
}


/* =====================================================
   APP ICON
===================================================== */

.icon{

  width:150px;
  height:170px;

  border:0;

  border-radius:28px;

  padding:14px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #eafff8
    );

  cursor:pointer;

  box-shadow:
    0 10px 25px #087f7835;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:9px;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

  text-decoration:none;
}

.icon:hover{

  transform:translateY(-6px);

  box-shadow:
    0 16px 30px #087f7845;

}

.icon:active{

  transform:scale(.94);

  box-shadow:
    0 5px 14px #087f7830;

}


/* =====================================================
   APP EMOJIS
===================================================== */

.app-emoji{

  font-size:72px;

  line-height:1;

  display:block;

  filter:
    drop-shadow(
      0 5px 8px #087f7840
    );

  transform:scale(1.05);

}


/* =====================================================
   APP NAME
===================================================== */

.app-name{

  font-size:15px;

  line-height:1.15;

  font-weight:900;

  color:#087f78;

  letter-spacing:.5px;

  text-align:center;

  margin-top:4px;

}


/* =====================================================
   APP DESCRIPTION
===================================================== */

.app-description{

  margin-top:9px;

  font-size:12px;

  color:#718080;

  text-align:center;

  line-height:1.4;

  max-width:170px;

}


/* =====================================================
   OPENING SCREEN
===================================================== */

#opening{

  position:fixed;

  inset:0;

  z-index:200;

  background:#f5fbfa;

  display:none;

  align-items:center;

  justify-content:center;
}

#opening.show{
  display:flex;
}

.open-content{

  text-align:center;

  animation:
    openAnimation .35s ease;
}

.open-icon{

  font-size:75px;

  line-height:1;

  margin-bottom:14px;
}

.open-title{

  font-size:20px;

  font-weight:900;

  color:#087f78;
}

.open-subtitle{

  margin-top:7px;

  font-size:13px;

  color:#718080;
}

@keyframes openAnimation{

  from{
    opacity:0;
    transform:scale(.85);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  main{
    padding:25px 15px 40px;
  }

  .myapps{
    font-size:23px;
    margin-bottom:17px;
  }

  .card{
    padding:20px 14px;
    border-radius:22px;
  }

  .apps-grid{

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap:18px 12px;

  }

  .icon{

    width:135px;

    max-width:100%;

    height:155px;

    border-radius:25px;

  }

  .app-emoji{

    font-size:62px;

  }

  .app-name{

    font-size:14px;

  }

  .app-description{

    font-size:11px;

  }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:390px){

  .apps-grid{

    gap:15px 8px;

  }

  .icon{

    width:125px;

    height:145px;

  }

  .app-emoji{

    font-size:55px;

  }

  .app-name{

    font-size:13px;

  }

}


/* =====================================================
   LARGE DESKTOP
===================================================== */

@media(min-width:1000px){

  .icon{

    width:175px;

    height:190px;

  }

  .app-emoji{

    font-size:80px;

  }

  .app-name{

    font-size:16px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     SPLASH
===================================================== -->

<div id="splash">

  <div class="sbox">

    <img
      class="slogo"
      src="./nasho-logo.png"
      alt="NASHO"
    >

    <div class="stitle">
      NASHO Health Center
    </div>

    <div class="ssub">
      Mobile App
    </div>

    <div class="bar">
      <i></i>
    </div>

  </div>

</div>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <img
    class="hlogo"
    src="./nasho-logo.png"
    alt="NASHO"
  >

  <div>

    <div class="htitle">
      NASHO Health Center
    </div>

    <div class="hsub">
      Mobile App
    </div>

  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

  <div class="myapps">
    MY APPS
  </div>


  <section class="card">

    <div class="apps-grid">


      <!-- =================================================
           NASHO HC
      ================================================== -->

      <a
        class="app-item"
        href="https://nasho-hc-services.vercel.app/"
      >

        <div class="icon">

          <span class="app-emoji">
            🏥
          </span>

          <span class="app-name">
            NASHO HC
          </span>

        </div>

        <div class="app-description">
          NASHO Health Center Services
        </div>

      </a>


      <!-- =================================================
           BIRTH CERTIFICATE
      ================================================== -->

      <a
        class="app-item"
        href="https://birth-certificate-nasho-hc.vercel.app/"
      >

        <div class="icon">

          <span class="app-emoji">
            📜
          </span>

          <span class="app-name">
            BIRTH CERTIFICATE
          </span>

        </div>

        <div class="app-description">
          Medical Birth Certificate
        </div>

      </a>


      <!-- =================================================
           ADMIN CRVS
      ================================================== -->

      <a
        class="app-item"
        href="https://birth-certificate-nasho-hc.vercel.app/admin.html"
      >

        <div class="icon">

          <span class="app-emoji">
            🛡️
          </span>

          <span class="app-name">
            ADMIN CRVS
          </span>

        </div>

        <div class="app-description">
          CRVS Administration
        </div>

      </a>


    </div>

  </section>

</main>


<!-- =====================================================
     OPENING SCREEN
===================================================== -->

<div id="opening">

  <div class="open-content">

    <div
      id="openIcon"
      class="open-icon"
    >
      🏥
    </div>

    <div
      id="openTitle"
      class="open-title"
    >
      NASHO HC
    </div>

    <div class="open-subtitle">
      Opening application...
    </div>

  </div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


/* =====================================================
   SPLASH SCREEN
===================================================== */

setTimeout(function(){

  const splash =
    document.getElementById("splash");

  if(splash){
    splash.remove();
  }

},3000);


/* =====================================================
   APP OPENING ANIMATION
===================================================== */

const appLinks =
  document.querySelectorAll(".app-item");


appLinks.forEach(function(app){

  app.addEventListener("click",function(e){

    /*
      Allow normal browser navigation.
      We only show a very short opening animation.
    */

    const opening =
      document.getElementById("opening");

    const icon =
      this.querySelector(".app-emoji");

    const name =
      this.querySelector(".app-name");

    if(icon){
      document.getElementById("openIcon").textContent =
        icon.textContent.trim();
    }

    if(name){
      document.getElementById("openTitle").textContent =
        name.textContent.trim();
    }

    opening.classList.add("show");

  });

});


</script>


</body>
</html>
