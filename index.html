<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#087f78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NASHO">

<title>NASHO Health Center</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./nasho-logo.png" type="image/png">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
}

body{
  background:#f5fbfa;
  color:#123;
  overflow:hidden;
}

/* =====================================================
   SPLASH SCREEN
===================================================== */

#splash{
  position:fixed;
  inset:0;
  z-index:10;

  background:
    linear-gradient(
      145deg,
      #064f50,
      #087f78,
      #43b96b
    );

  display:flex;
  align-items:center;
  justify-content:center;
}

.sbox{
  text-align:center;
  color:white;
  padding:20px;
}

.slogo{
  width:120px;
  height:120px;

  border-radius:28px;

  object-fit:cover;

  display:block;

  margin:0 auto 20px;

  background:white;
}

.stitle{
  font-size:26px;
  font-weight:800;
}

.ssub{
  margin-top:8px;
  font-size:14px;
}

.bar{
  width:210px;
  height:5px;

  background:#ffffff55;

  border-radius:10px;

  margin:28px auto 0;

  overflow:hidden;
}

.bar i{
  display:block;
  width:0;
  height:100%;

  background:white;

  animation:load 3s linear forwards;
}

@keyframes load{
  to{
    width:100%;
  }
}


/* =====================================================
   HEADER
===================================================== */

.header{
  height:76px;

  background:white;

  border-bottom:1px solid #e5eeee;

  display:flex;
  align-items:center;

  padding:0 18px;

  gap:12px;
}

.hlogo{
  width:46px;
  height:46px;

  border-radius:13px;

  object-fit:cover;
}

.htitle{
  font-size:17px;
  font-weight:800;
  color:#087f78;
}

.hsub{
  font-size:12px;
  color:#718080;
  margin-top:2px;
}


/* =====================================================
   MAIN
===================================================== */

main{
  padding:30px 20px;
}

.myapps{
  font-size:25px;
  font-weight:800;

  margin-bottom:20px;
}

.card{
  background:white;

  border:1px solid #e5eeee;

  border-radius:24px;

  min-height:180px;

  padding:28px;

  box-shadow:
    0 10px 28px #087f7814;
}


/* =====================================================
   NASHO HC APP ICON
===================================================== */

.icon{

  width:125px;
  height:145px;

  border:0;

  border-radius:26px;

  padding:12px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #eafff8
    );

  cursor:pointer;

  box-shadow:
    0 10px 25px #087f7835;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:7px;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}


/* Emoji */

.hospital-emoji{

  font-size:78px;

  line-height:1;

  display:block;

  /* teal/green effect */
  filter:
    drop-shadow(0 5px 8px #087f7840);

  transform:
    scale(1.08);

}


/* NASHO HC text */

.hospital-name{

  font-size:16px;

  line-height:1;

  font-weight:900;

  color:#087f78;

  letter-spacing:1px;

  text-align:center;

  margin-top:3px;

}


/* click effect */

.icon:active{

  transform:scale(.94);

  box-shadow:
    0 5px 14px #087f7830;

}


/* =====================================================
   OPENING SCREEN
===================================================== */

#opening{

  position:fixed;

  inset:0;

  z-index:20;

  background:#f5fbfa;

  display:none;

  align-items:center;

  justify-content:center;
}

#opening.show{
  display:flex;
}

.openlogo{

  width:92px;
  height:92px;

  border-radius:24px;

  object-fit:cover;
}

</style>
</head>
